name: PithDemo
options:
  bundleIdPrefix: local.pith
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  PithEditor:
    path: .
targets:
  PithDemo:
    type: application
    platform: macOS
    sources: [Demo]
    dependencies:
      - package: PithEditor
    info:
      path: Demo/Info.plist
      properties:
        CFBundleName: Pith
        CFBundleDisplayName: Pith
        NSPrincipalClass: NSApplication
        LSMinimumSystemVersion: "14.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.pith.demo
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_APP_SANDBOX: NO
