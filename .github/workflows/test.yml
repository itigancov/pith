name: test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Preview image with Xcode 27; `macos-26` has only Xcode 26.x.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Same Xcode as local development; bump together with it.
      - name: Select Xcode 27.2
        run: |
          test -d /Applications/Xcode_27.2.app || { echo "Xcode 27.2 not on runner"; exit 1; }
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
          swift --version
      - name: Install xcodegen
        run: |
          brew install xcodegen
          xcodegen --version
      - run: make test
      - run: make build
